<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control Escolar QR GSR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #17365d;
      text-align: center;
    }

    header {
      background: #17365d;
      color: white;
      padding: 16px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
    }

    main {
      max-width: 500px;
      margin: auto;
      padding: 15px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    #estado {
      margin-top: 15px;
      padding: 20px 15px;
      border-radius: 15px;
      background: white;
      min-height: 115px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      transition: .2s;
    }

    .entrada {
      background: #e8f5e9 !important;
      color: #146c2e;
      border: 2px solid #4caf50;
    }

    .salida {
      background: #e3f2fd !important;
      color: #0d47a1;
      border: 2px solid #2196f3;
    }

    .duplicado {
      background: #fff8e1 !important;
      color: #805b00;
      border: 2px solid #ffc107;
    }

    .error {
      background: #ffebee !important;
      color: #b71c1c;
      border: 2px solid #ef5350;
    }

    .mensaje {
      font-size: 20px;
      font-weight: bold;
    }

    .nombre {
      font-size: 24px;
      font-weight: bold;
      margin-top: 9px;
    }

    .grupo {
      font-size: 21px;
      margin-top: 6px;
    }

    .hora {
      font-size: 20px;
      margin-top: 6px;
      font-weight: bold;
    }

    .pie {
      margin-top: 14px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>CONTROL DE ACCESO</h1>
  <p>Escuela Primaria Prof. Graciano Sánchez Romo</p>
</header>

<main>

  <div id="reader"></div>

  <div id="estado">
    <div class="mensaje">📷 Iniciando cámara...</div>
  </div>

  <div class="pie">
    Ciclo Escolar 2026–2027
  </div>

</main>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx8r4ubVKQkRKfH6kCjVdLJWuktdn3mwaJ2hJrOxgzIOP-GATweZZw7DVgeEEFIa8US/exec";

let procesando = false;

// Último QR enviado al servidor
let ultimoCodigo = "";

// Momento en que se envió
let ultimoEnvio = 0;

// Protección adicional del teléfono
const BLOQUEO_LOCAL_MS = 5000;


/* =========================================
   QR DETECTADO
========================================= */

function qrDetectado(texto) {

  texto = String(texto || "")
    .trim()
    .toUpperCase();

  if (!texto) {
    return;
  }

  const ahora = Date.now();

  // Si todavía estamos esperando respuesta
  // del servidor, ignoramos TODO.
  if (procesando) {
    return;
  }

  // Si la cámara continúa viendo el mismo QR,
  // no volver a enviarlo inmediatamente.
  if (
    texto === ultimoCodigo &&
    ahora - ultimoEnvio < BLOQUEO_LOCAL_MS
  ) {
    return;
  }

  procesando = true;
  ultimoCodigo = texto;
  ultimoEnvio = ahora;

  const estado =
    document.getElementById("estado");

  estado.className = "";

  estado.innerHTML =
    '<div class="mensaje">⏳ VERIFICANDO...</div>' +
    '<p>Procesando credencial</p>';

  const url =
    API_URL +
    "?matricula=" +
    encodeURIComponent(texto) +
    "&t=" +
    Date.now();


  fetch(url, {
    method: "GET",
    cache: "no-store"
  })

  .then(function(respuesta) {

    if (!respuesta.ok) {
      throw new Error(
        "HTTP " + respuesta.status
      );
    }

    return respuesta.json();
  })

  .then(function(resultado) {

    mostrarResultado(resultado);

  })

  .catch(function(error) {

    console.error(error);

    estado.className = "error";

    estado.innerHTML =
      '<div class="mensaje">' +
      '❌ ERROR DE CONEXIÓN' +
      '</div>' +
      '<p>No se pudo completar el registro.</p>';

    vibrar([300,100,300]);

    setTimeout(listoSiguiente, 3000);
  });
}


/* =========================================
   MOSTRAR RESULTADO
========================================= */

function mostrarResultado(resultado) {

  const estado =
    document.getElementById("estado");


  // -------------------------
  // REGISTRO CORRECTO
  // -------------------------

  if (resultado.ok) {

    if (resultado.tipo === "SALIDA") {

      estado.className = "salida";

      estado.innerHTML =
        '<div class="mensaje">' +
        '🔵 SALIDA REGISTRADA' +
        '</div>' +

        '<div class="nombre">' +
        escapar(resultado.nombre) +
        '</div>' +

        '<div class="grupo">' +
        resultado.grado +
        '.º ' +
        escapar(resultado.grupo) +
        '</div>' +

        '<div class="hora">' +
        '🕐 ' +
        escapar(resultado.hora) +
        '</div>';

      vibrar([150,80,150]);

    } else {

      estado.className = "entrada";

      estado.innerHTML =
        '<div class="mensaje">' +
        '🟢 ENTRADA REGISTRADA' +
        '</div>' +

        '<div class="nombre">' +
        escapar(resultado.nombre) +
        '</div>' +

        '<div class="grupo">' +
        resultado.grado +
        '.º ' +
        escapar(resultado.grupo) +
        '</div>' +

        '<div class="hora">' +
        '🕐 ' +
        escapar(resultado.hora) +
        '</div>';

      vibrar([100,60,100]);
    }

    // Dejamos visible el resultado unos segundos.
    setTimeout(listoSiguiente, 2500);
    return;
  }


  // -------------------------
  // REESCANEO ACCIDENTAL
  // -------------------------

  if (resultado.duplicado) {

    estado.className = "duplicado";

    const tipo =
      resultado.tipo || "REGISTRO";

    estado.innerHTML =
      '<div class="mensaje">' +
      '⚠️ ' +
      escapar(tipo) +
      ' YA REGISTRADA' +
      '</div>' +

      '<div class="nombre">' +
      escapar(resultado.nombre) +
      '</div>' +

      '<div class="grupo">' +
      resultado.grado +
      '.º ' +
      escapar(resultado.grupo) +
      '</div>' +

      '<p>No se creó otro registro.</p>';

    vibrar([250]);

    setTimeout(listoSiguiente, 2500);
    return;
  }


  // -------------------------
  // YA TIENE ENTRADA Y SALIDA
  // -------------------------

  if (resultado.completo) {

    estado.className = "error";

    estado.innerHTML =
      '<div class="mensaje">' +
      '⛔ REGISTRO COMPLETO' +
      '</div>' +

      '<div class="nombre">' +
      escapar(resultado.nombre) +
      '</div>' +

      '<div class="grupo">' +
      resultado.grado +
      '.º ' +
      escapar(resultado.grupo) +
      '</div>' +

      '<p>Ya tiene entrada y salida registradas hoy.</p>';

    vibrar([300,100,300]);

    setTimeout(listoSiguiente, 3000);
    return;
  }


  // -------------------------
  // OTROS ERRORES
  // -------------------------

  estado.className = "error";

  estado.innerHTML =
    '<div class="mensaje">❌ ERROR</div>' +
    '<p>' +
    escapar(
      resultado.mensaje ||
      "No fue posible registrar."
    ) +
    '</p>';

  vibrar([300,100,300]);

  setTimeout(listoSiguiente, 3000);
}


/* =========================================
   PREPARAR SIGUIENTE ALUMNO
========================================= */

function listoSiguiente() {

  procesando = false;

  const estado =
    document.getElementById("estado");

  estado.className = "";

  estado.innerHTML =
    '<div class="mensaje">' +
    '📷 LISTO PARA EL SIGUIENTE ALUMNO' +
    '</div>' +
    '<p>Acerque la credencial a la cámara.</p>';
}


/* =========================================
   SEGURIDAD TEXTO
========================================= */

function escapar(texto) {

  const div =
    document.createElement("div");

  div.textContent =
    String(texto || "");

  return div.innerHTML;
}


/* =========================================
   VIBRACIÓN
========================================= */

function vibrar(patron) {

  if (navigator.vibrate) {
    navigator.vibrate(patron);
  }
}


/* =========================================
   INICIAR CÁMARA
========================================= */

const lector =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]
    },

    false
  );


lector.render(
  qrDetectado,

  function(error) {
    // Es normal que existan errores de lectura
    // mientras no haya un QR frente a la cámara.
  }
);

</script>

</body>
</html>
