<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Transporte GSR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #17365d;
      text-align: center;
    }

    header {
      background: #17365d;
      color: white;
      padding: 14px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
    }

    main {
      max-width: 500px;
      margin: auto;
      padding: 14px;
    }

    .tituloSelector {
      font-size: 13px;
      font-weight: bold;
      color: #555;
      margin: 10px 0 6px;
    }

    .selector {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .boton {
      flex: 1;
      padding: 14px 5px;
      border-radius: 12px;
      border: 2px solid #ccc;
      background: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      opacity: .5;
    }

    #btnEntrada.activo {
      background: #2e7d32;
      color: white;
      border-color: #2e7d32;
      opacity: 1;
    }

    #btnSalida.activo {
      background: #1565c0;
      color: white;
      border-color: #1565c0;
      opacity: 1;
    }

    #btnRuta1.activo,
    #btnRuta2.activo {
      background: #ef6c00;
      color: white;
      border-color: #ef6c00;
      opacity: 1;
    }

    #configActual {
      margin: 12px 0;
      padding: 10px;
      border-radius: 10px;
      background: #fff;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    #estado {
      margin-top: 15px;
      padding: 20px 15px;
      border-radius: 15px;
      background: white;
      min-height: 135px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .entrada {
      background: #e8f5e9 !important;
      color: #146c2e;
      border: 2px solid #4caf50;
    }

    .salida {
      background: #e3f2fd !important;
      color: #0d47a1;
      border: 2px solid #2196f3;
    }

    .duplicado {
      background: #fff8e1 !important;
      color: #805b00;
      border: 2px solid #ffc107;
    }

    .advertencia {
      background: #fff3e0 !important;
      color: #8a4b00;
      border: 2px solid #ff9800;
    }

    .error {
      background: #ffebee !important;
      color: #b71c1c;
      border: 2px solid #ef5350;
    }

    .mensaje {
      font-size: 20px;
      font-weight: bold;
    }

    .nombre {
      font-size: 24px;
      font-weight: bold;
      margin-top: 9px;
    }

    .grupo {
      font-size: 20px;
      margin-top: 5px;
    }

    .ruta {
      margin-top: 13px;
      font-size: 22px;
      font-weight: bold;
    }

    .parada {
      margin-top: 7px;
      font-size: 19px;
      font-weight: bold;
    }

    .hora {
      font-size: 20px;
      margin-top: 9px;
      font-weight: bold;
    }

    .detalleError {
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .pie {
      margin-top: 14px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>🚌 CONTROL DE TRANSPORTE</h1>
  <p>Escuela Primaria Prof. Graciano Sánchez Romo</p>
</header>

<main>

  <!-- =========================================
       MOVIMIENTO
  ========================================== -->

  <div class="tituloSelector">
    1. SELECCIONA EL MOVIMIENTO
  </div>

  <div class="selector">

    <button
      id="btnEntrada"
      class="boton activo"
      onclick="cambiarModo('ENTRADA')">
      🟢 ENTRADA
    </button>

    <button
      id="btnSalida"
      class="boton"
      onclick="cambiarModo('SALIDA')">
      🔵 SALIDA
    </button>

  </div>


  <!-- =========================================
       RUTA
  ========================================== -->

  <div class="tituloSelector">
    2. SELECCIONA EL AUTOBÚS
  </div>

  <div class="selector">

    <button
      id="btnRuta1"
      class="boton"
      onclick="cambiarRuta('RUTA 1')">
      🚌 RUTA 1
    </button>

    <button
      id="btnRuta2"
      class="boton"
      onclick="cambiarRuta('RUTA 2')">
      🚌 RUTA 2
    </button>

  </div>


  <!-- =========================================
       CONFIGURACIÓN ACTUAL
  ========================================== -->

  <div id="configActual">
    🟢 ENTRADA · ⚠️ SELECCIONA UNA RUTA
  </div>


  <!-- =========================================
       CÁMARA
  ========================================== -->

  <div id="reader"></div>


  <!-- =========================================
       RESULTADO
  ========================================== -->

  <div id="estado">

    <div class="mensaje">
      🚌 Selecciona RUTA 1 o RUTA 2
    </div>

  </div>


  <div class="pie">
    Ciclo Escolar 2026–2027
  </div>

</main>


<script>

/* ======================================================
   CONFIGURACIÓN
====================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx8r4ubVKQkRKfH6kCjVdLJWuktdn3mwaJ2hJrOxgzIOP-GATweZZw7DVgeEEFIa8US/exec";


let tipoActual = "ENTRADA";

// La ruta NO queda seleccionada automáticamente.
// Esto evita comenzar a escanear accidentalmente
// en el autobús equivocado.
let rutaActual = "";

let procesando = false;

let ultimoCodigo = "";

let ultimoEnvio = 0;

const BLOQUEO_LOCAL_MS = 8000;



/* ======================================================
   CAMBIAR MOVIMIENTO
====================================================== */

function cambiarModo(tipo) {

  if (procesando) {
    return;
  }

  tipoActual = tipo;

  const entrada =
    document.getElementById("btnEntrada");

  const salida =
    document.getElementById("btnSalida");


  if (tipo === "ENTRADA") {

    entrada.classList.add("activo");

    salida.classList.remove("activo");

  } else {

    salida.classList.add("activo");

    entrada.classList.remove("activo");

  }


  ultimoCodigo = "";
  ultimoEnvio = 0;

  actualizarConfiguracion();

  listoSiguiente();
}



/* ======================================================
   CAMBIAR RUTA
====================================================== */

function cambiarRuta(ruta) {

  if (procesando) {
    return;
  }

  rutaActual = ruta;


  const ruta1 =
    document.getElementById("btnRuta1");

  const ruta2 =
    document.getElementById("btnRuta2");


  if (ruta === "RUTA 1") {

    ruta1.classList.add("activo");

    ruta2.classList.remove("activo");

  } else {

    ruta2.classList.add("activo");

    ruta1.classList.remove("activo");

  }


  ultimoCodigo = "";
  ultimoEnvio = 0;

  actualizarConfiguracion();

  listoSiguiente();
}



/* ======================================================
   MOSTRAR CONFIGURACIÓN
====================================================== */

function actualizarConfiguracion() {

  const config =
    document.getElementById("configActual");


  const movimiento =
    tipoActual === "ENTRADA"
      ? "🟢 ENTRADA"
      : "🔵 SALIDA";


  const ruta =
    rutaActual
      ? "🚌 " + rutaActual
      : "⚠️ SELECCIONA UNA RUTA";


  config.innerHTML =
    movimiento +
    " · " +
    ruta;
}



/* ======================================================
   QR DETECTADO
====================================================== */

function qrDetectado(texto) {

  texto =
    String(texto || "")
      .trim()
      .toUpperCase();


  if (!texto || procesando) {
    return;
  }


  // No permitimos enviar nada al servidor
  // mientras no se haya seleccionado autobús.

  if (!rutaActual) {

    const estado =
      document.getElementById("estado");

    estado.className =
      "advertencia";

    estado.innerHTML =
      '<div class="mensaje">' +
      '⚠️ SELECCIONA UNA RUTA' +
      '</div>' +

      '<p>Selecciona RUTA 1 o RUTA 2 antes de escanear.</p>';

    vibrar([250,100,250]);

    return;
  }


  const ahora =
    Date.now();


  if (
    texto === ultimoCodigo &&
    ahora - ultimoEnvio < BLOQUEO_LOCAL_MS
  ) {
    return;
  }


  procesando = true;

  ultimoCodigo = texto;

  ultimoEnvio = ahora;


  const estado =
    document.getElementById("estado");


  estado.className = "";


  estado.innerHTML =
    '<div class="mensaje">' +
    '⏳ VERIFICANDO...' +
    '</div>' +

    '<p>' +
    escapar(tipoActual) +
    ' · ' +
    escapar(rutaActual) +
    '</p>';


  const url =
    API_URL +

    "?matricula=" +
    encodeURIComponent(texto) +

    "&tipo=" +
    encodeURIComponent(tipoActual) +

    "&ruta=" +
    encodeURIComponent(rutaActual) +

    "&t=" +
    Date.now();


  fetch(
    url,
    {
      method: "GET",
      cache: "no-store"
    }
  )

  .then(function(respuesta) {

    if (!respuesta.ok) {

      throw new Error(
        "HTTP " +
        respuesta.status
      );
    }

    return respuesta.json();
  })

  .then(function(resultado) {

    mostrarResultado(resultado);

  })

  .catch(function(error) {

    console.error(error);

    estado.className =
      "error";

    estado.innerHTML =
      '<div class="mensaje">' +
      '❌ ERROR DE CONEXIÓN' +
      '</div>' +

      '<p>No se pudo completar el registro.</p>';

    vibrar([300,100,300]);

    setTimeout(
      listoSiguiente,
      3000
    );
  });
}



/* ======================================================
   MOSTRAR RESULTADO
====================================================== */

function mostrarResultado(resultado) {

  const estado =
    document.getElementById("estado");


  // ====================================================
  // REGISTRO CORRECTO
  // ====================================================

  if (resultado.ok) {


    // Alumno todavía sin ruta asignada.
    // El registro SÍ se realizó.

    if (resultado.rutaPendiente) {

      estado.className =
        "advertencia";


      estado.innerHTML =
        '<div class="mensaje">' +
        '⚠️ REGISTRADO · RUTA PENDIENTE' +
        '</div>' +

        datosAlumno(resultado) +

        '<p><strong>El movimiento sí fue registrado.</strong></p>' +

        '<p>Este alumno todavía necesita una ruta asignada en ALUMNOS.</p>';


      vibrar(
        [150,80,150,80,150]
      );


      setTimeout(
        listoSiguiente,
        4000
      );

      return;
    }


    // SALIDA CORRECTA

    if (resultado.tipo === "SALIDA") {

      estado.className =
        "salida";


      estado.innerHTML =
        '<div class="mensaje">' +
        '🔵 SALIDA REGISTRADA' +
        '</div>' +

        datosAlumno(resultado);


      vibrar(
        [150,80,150]
      );


    // ENTRADA CORRECTA

    } else {

      estado.className =
        "entrada";


      estado.innerHTML =
        '<div class="mensaje">' +
        '🟢 ENTRADA REGISTRADA' +
        '</div>' +

        datosAlumno(resultado);


      vibrar(
        [100,60,100]
      );
    }


    setTimeout(
      listoSiguiente,
      3000
    );

    return;
  }



  // ====================================================
  // RUTA INCORRECTA
  // ====================================================

  if (resultado.rutaIncorrecta) {

    estado.className =
      "error";


    estado.innerHTML =
      '<div class="mensaje">' +
      '⛔ RUTA INCORRECTA' +
      '</div>' +

      '<div class="nombre">' +
      escapar(resultado.nombre) +
      '</div>' +

      '<div class="grupo">' +
      escapar(resultado.grado) +
      '.º ' +
      escapar(resultado.grupo) +
      '</div>' +

      '<div class="detalleError">' +
      'Seleccionada: ' +
      escapar(resultado.rutaSeleccionada) +
      '</div>' +

      '<div class="ruta">' +
      '🚌 CORRECTA: ' +
      escapar(resultado.ruta) +
      '</div>' +

      '<div class="parada">' +
      '📍 ' +
      escapar(
        resultado.parada ||
        "PENDIENTE"
      ) +
      '</div>' +

      '<p><strong>NO se registró el movimiento.</strong></p>';


    vibrar(
      [400,150,400]
    );


    setTimeout(
      listoSiguiente,
      5000
    );

    return;
  }



  // ====================================================
  // DUPLICADO
  // ====================================================

  if (resultado.duplicado) {

    estado.className =
      "duplicado";


    estado.innerHTML =
      '<div class="mensaje">' +
      '⚠️ ' +
      escapar(resultado.tipo) +
      ' YA REGISTRADA' +
      '</div>' +

      datosAlumnoSinHora(resultado) +

      '<p>No se creó otro registro.</p>';


    vibrar([250]);


    setTimeout(
      listoSiguiente,
      3000
    );

    return;
  }



  // ====================================================
  // SALIDA SIN ENTRADA
  // ====================================================

  if (resultado.sinEntrada) {

    estado.className =
      "error";


    estado.innerHTML =
      '<div class="mensaje">' +
      '⛔ SIN ENTRADA REGISTRADA' +
      '</div>' +

      datosAlumnoSinHora(resultado) +

      '<p>No se registró la salida.</p>';


    vibrar(
      [300,100,300]
    );


    setTimeout(
      listoSiguiente,
      4000
    );

    return;
  }



  // ====================================================
  // NO USA TRANSPORTE
  // ====================================================

  if (resultado.noTransporte) {

    estado.className =
      "error";


    estado.innerHTML =
      '<div class="mensaje">' +
      '⛔ NO REGISTRADO EN TRANSPORTE' +
      '</div>' +

      '<div class="nombre">' +
      escapar(resultado.nombre) +
      '</div>' +

      '<div class="grupo">' +
      escapar(resultado.grado) +
      '.º ' +
      escapar(resultado.grupo) +
      '</div>' +

      '<p>No se creó ningún registro.</p>';


    vibrar(
      [300,100,300]
    );


    setTimeout(
      listoSiguiente,
      4000
    );

    return;
  }



  // ====================================================
  // OTRO ERROR
  // ====================================================

  estado.className =
    "error";


  estado.innerHTML =
    '<div class="mensaje">' +
    '❌ ERROR' +
    '</div>' +

    '<p>' +
    escapar(
      resultado.mensaje ||
      "No fue posible registrar."
    ) +
    '</p>';


  vibrar(
    [300,100,300]
  );


  setTimeout(
    listoSiguiente,
    3000
  );
}



/* ======================================================
   DATOS DEL ALUMNO
====================================================== */

function datosAlumno(resultado) {

  return (

    '<div class="nombre">' +
    escapar(resultado.nombre) +
    '</div>' +

    '<div class="grupo">' +
    escapar(resultado.grado) +
    '.º ' +
    escapar(resultado.grupo) +
    '</div>' +

    '<div class="ruta">' +
    '🚌 ASIGNADA: ' +
    escapar(
      resultado.ruta ||
      "PENDIENTE"
    ) +
    '</div>' +

    '<div class="parada">' +
    '📍 ' +
    escapar(
      resultado.parada ||
      "PENDIENTE"
    ) +
    '</div>' +

    '<div class="hora">' +
    '🕐 ' +
    escapar(resultado.hora) +
    '</div>'

  );
}



/* ======================================================
   DATOS SIN HORA
====================================================== */

function datosAlumnoSinHora(resultado) {

  return (

    '<div class="nombre">' +
    escapar(resultado.nombre) +
    '</div>' +

    '<div class="grupo">' +
    escapar(resultado.grado) +
    '.º ' +
    escapar(resultado.grupo) +
    '</div>' +

    '<div class="ruta">' +
    '🚌 ' +
    escapar(
      resultado.ruta ||
      "PENDIENTE"
    ) +
    '</div>' +

    '<div class="parada">' +
    '📍 ' +
    escapar(
      resultado.parada ||
      "PENDIENTE"
    ) +
    '</div>'

  );
}



/* ======================================================
   LISTO PARA SIGUIENTE
====================================================== */

function listoSiguiente() {

  procesando = false;


  const estado =
    document.getElementById("estado");


  if (!rutaActual) {

    estado.className =
      "advertencia";

    estado.innerHTML =
      '<div class="mensaje">' +
      '🚌 SELECCIONA UNA RUTA' +
      '</div>';

    return;
  }


  estado.className = "";


  estado.innerHTML =
    '<div class="mensaje">' +
    '📷 LISTO PARA EL SIGUIENTE ALUMNO' +
    '</div>' +

    '<p><strong>' +
    escapar(tipoActual) +
    ' · ' +
    escapar(rutaActual) +
    '</strong></p>';
}



/* ======================================================
   SEGURIDAD DE TEXTO
====================================================== */

function escapar(texto) {

  const div =
    document.createElement("div");

  div.textContent =
    String(
      texto ?? ""
    );

  return div.innerHTML;
}



/* ======================================================
   VIBRACIÓN
====================================================== */

function vibrar(patron) {

  if (navigator.vibrate) {

    navigator.vibrate(
      patron
    );
  }
}



/* ======================================================
   INICIAR CÁMARA
====================================================== */

const lector =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera:
        true,

      supportedScanTypes: [

        Html5QrcodeScanType
          .SCAN_TYPE_CAMERA

      ]

    },

    false
  );


lector.render(

  qrDetectado,

  function(error) {

    // Es normal recibir errores mientras
    // la cámara busca un QR.

  }

);

</script>

</body>
</html>
