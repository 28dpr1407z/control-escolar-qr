<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Transporte Escolar GSR</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #17365d;
  text-align: center;
}

header {
  background: #17365d;
  color: white;
  padding: 14px 8px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 5px 0 0;
  font-size: 13px;
}

main {
  max-width: 520px;
  margin: auto;
  padding: 12px;
}

.titulo {
  margin: 11px 0 6px;
  font-size: 13px;
  font-weight: bold;
}

.selector {
  display: flex;
  gap: 9px;
}

.boton {
  flex: 1;
  padding: 14px 4px;
  border-radius: 12px;
  border: 2px solid #ccc;
  background: white;
  font-size: 16px;
  font-weight: bold;
  opacity: .5;
}

#btnEntrada.activo {
  background: #2e7d32;
  border-color: #2e7d32;
  color: white;
  opacity: 1;
}

#btnSalida.activo {
  background: #1565c0;
  border-color: #1565c0;
  color: white;
  opacity: 1;
}

#btnRuta1.activo,
#btnRuta2.activo {
  background: #ef6c00;
  border-color: #ef6c00;
  color: white;
  opacity: 1;
}

#config {
  margin: 12px 0;
  padding: 10px;
  background: white;
  border-radius: 10px;
  font-weight: bold;
}

#reader {
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

#estado {
  margin-top: 14px;
  padding: 18px 12px;
  min-height: 130px;
  border-radius: 15px;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.entrada {
  background: #e8f5e9 !important;
  border: 2px solid #4caf50;
  color: #146c2e;
}

.salida {
  background: #e3f2fd !important;
  border: 2px solid #2196f3;
  color: #0d47a1;
}

.advertencia {
  background: #fff8e1 !important;
  border: 2px solid #ffc107;
  color: #795500;
}

.error {
  background: #ffebee !important;
  border: 2px solid #ef5350;
  color: #b71c1c;
}

.mensaje {
  font-size: 21px;
  font-weight: bold;
}

.nombre {
  margin-top: 9px;
  font-size: 24px;
  font-weight: bold;
}

.grupo {
  margin-top: 5px;
  font-size: 20px;
}

.ruta {
  margin-top: 12px;
  font-size: 21px;
  font-weight: bold;
}

.parada {
  margin-top: 7px;
  font-size: 19px;
  font-weight: bold;
}

.hora {
  margin-top: 9px;
  font-size: 20px;
  font-weight: bold;
}

.pie {
  margin: 14px 0;
  font-size: 12px;
  color: #777;
}

</style>

</head>

<body>

<header>

<h1>🚌 CONTROL DE TRANSPORTE</h1>

<p>
Escuela Primaria Prof. Graciano Sánchez Romo
</p>

</header>


<main>

<div class="titulo">
1. MOVIMIENTO
</div>

<div class="selector">

<button
id="btnEntrada"
class="boton activo"
onclick="cambiarMovimiento('ENTRADA')">

🟢 ENTRADA

</button>


<button
id="btnSalida"
class="boton"
onclick="cambiarMovimiento('SALIDA')">

🔵 SALIDA

</button>

</div>


<div class="titulo">
2. AUTOBÚS
</div>


<div class="selector">

<button
id="btnRuta1"
class="boton"
onclick="cambiarRuta('RUTA 1')">

🚌 RUTA 1

</button>


<button
id="btnRuta2"
class="boton"
onclick="cambiarRuta('RUTA 2')">

🚌 RUTA 2

</button>

</div>


<div id="config">

🟢 ENTRADA · ⚠️ SELECCIONA RUTA

</div>


<div id="reader"></div>


<div id="estado">

<div class="mensaje">

🚌 Selecciona el autobús

</div>

</div>


<div class="pie">

Ciclo Escolar 2026–2027

</div>

</main>


<script>

// ======================================================
// API
// ======================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbx8r4ubVKQkRKfH6kCjVdLJWuktdn3mwaJ2hJrOxgzIOP-GATweZZw7DVgeEEFIa8US/exec";


let movimiento = "ENTRADA";

let ruta = "";

let procesando = false;

let ultimoCodigo = "";

let ultimoMomento = 0;

const BLOQUEO_MS = 8000;


// ======================================================
// MOVIMIENTO
// ======================================================

function cambiarMovimiento(valor) {

  if (procesando) return;

  movimiento = valor;

  document
    .getElementById("btnEntrada")
    .classList
    .toggle(
      "activo",
      valor === "ENTRADA"
    );

  document
    .getElementById("btnSalida")
    .classList
    .toggle(
      "activo",
      valor === "SALIDA"
    );

  reiniciarLectura();

  actualizarConfig();

  listo();
}


// ======================================================
// RUTA
// ======================================================

function cambiarRuta(valor) {

  if (procesando) return;

  ruta = valor;

  document
    .getElementById("btnRuta1")
    .classList
    .toggle(
      "activo",
      valor === "RUTA 1"
    );

  document
    .getElementById("btnRuta2")
    .classList
    .toggle(
      "activo",
      valor === "RUTA 2"
    );

  reiniciarLectura();

  actualizarConfig();

  listo();
}


// ======================================================
// CONFIGURACIÓN
// ======================================================

function actualizarConfig() {

  const icono =
    movimiento === "ENTRADA"
      ? "🟢"
      : "🔵";

  document.getElementById("config").innerHTML =
    icono +
    " " +
    movimiento +
    " · " +
    (
      ruta
        ? "🚌 " + ruta
        : "⚠️ SELECCIONA RUTA"
    );
}


// ======================================================
// ESCANEO
// ======================================================

function escaneado(texto) {

  texto =
    String(texto || "")
      .trim()
      .toUpperCase();


  if (!texto || procesando) return;


  if (!ruta) {

    mostrar(
      "advertencia",
      "⚠️ SELECCIONA UNA RUTA",
      "Selecciona RUTA 1 o RUTA 2."
    );

    vibrar([250,100,250]);

    return;
  }


  const ahora = Date.now();


  if (
    texto === ultimoCodigo &&
    ahora - ultimoMomento < BLOQUEO_MS
  ) {
    return;
  }


  procesando = true;

  ultimoCodigo = texto;

  ultimoMomento = ahora;


  mostrar(
    "",
    "⏳ VERIFICANDO...",
    movimiento + " · " + ruta
  );


  const url =
    API_URL +
    "?matricula=" +
    encodeURIComponent(texto) +
    "&tipo=" +
    encodeURIComponent(movimiento) +
    "&ruta=" +
    encodeURIComponent(ruta) +
    "&t=" +
    Date.now();


  fetch(
    url,
    {
      method: "GET",
      cache: "no-store"
    }
  )

  .then(function(respuesta) {

    if (!respuesta.ok) {
      throw new Error(
        "HTTP " + respuesta.status
      );
    }

    return respuesta.json();
  })

  .then(function(resultado) {

    procesarResultado(resultado);
  })

  .catch(function(error) {

    console.error(error);

    mostrar(
      "error",
      "❌ ERROR DE CONEXIÓN",
      "No se pudo completar el registro."
    );

    vibrar([300,100,300]);

    setTimeout(listo, 3000);
  });
}


// ======================================================
// RESULTADOS
// ======================================================

function procesarResultado(r) {


  // ---------------- REGISTRO CORRECTO ----------------

  if (r.ok) {

    let clase =
      r.tipo === "ENTRADA"
        ? "entrada"
        : "salida";

    let titulo =
      r.tipo === "ENTRADA"
        ? "🟢 ENTRADA REGISTRADA"
        : "🔵 SALIDA REGISTRADA";


    if (r.rutaPendiente) {

      clase = "advertencia";

      titulo =
        "⚠️ REGISTRADO · RUTA PENDIENTE";
    }


    const contenido =
      alumnoHTML(r) +

      (
        r.rutaPendiente
          ? "<p><strong>Asignar ruta al alumno.</strong></p>"
          : ""
      );


    mostrar(
      clase,
      titulo,
      contenido,
      true
    );


    vibrar([120,70,120]);

    setTimeout(listo, 3500);

    return;
  }


  // ---------------- RUTA INCORRECTA ----------------

  if (r.rutaIncorrecta) {

    const contenido =
      '<div class="nombre">' +
      escapar(r.nombre) +
      '</div>' +

      '<div class="grupo">' +
      escapar(r.grado) +
      '.º ' +
      escapar(r.grupo) +
      '</div>' +

      '<div class="ruta">' +
      '🚌 RUTA CORRECTA: ' +
      escapar(r.ruta) +
      '</div>' +

      '<div class="parada">' +
      '📍 ' +
      escapar(
        r.parada ||
        "PENDIENTE"
      ) +
      '</div>' +

      '<p><strong>NO SE REGISTRÓ.</strong></p>';


    mostrar(
      "error",
      "⛔ RUTA INCORRECTA",
      contenido,
      true
    );


    vibrar([400,150,400]);

    setTimeout(listo, 5000);

    return;
  }


  // ---------------- DUPLICADO ----------------

  if (r.duplicado) {

    mostrar(
      "advertencia",
      "⚠️ " +
      escapar(r.tipo) +
      " YA REGISTRADA",
      alumnoSinHora(r),
      true
    );

    vibrar([250]);

    setTimeout(listo, 3000);

    return;
  }


  // ---------------- SALIDA SIN ENTRADA ----------------

  if (r.sinEntrada) {

    mostrar(
      "error",
      "⛔ SIN ENTRADA REGISTRADA",
      alumnoSinHora(r),
      true
    );

    vibrar([300,100,300]);

    setTimeout(listo, 4000);

    return;
  }


  // ---------------- NO TRANSPORTE ----------------

  if (r.noTransporte) {

    const contenido =
      '<div class="nombre">' +
      escapar(r.nombre) +
      '</div>' +

      '<div class="grupo">' +
      escapar(r.grado) +
      '.º ' +
      escapar(r.grupo) +
      '</div>' +

      '<p>No es usuario del transporte escolar.</p>';


    mostrar(
      "error",
      "⛔ NO REGISTRADO EN TRANSPORTE",
      contenido,
      true
    );

    vibrar([300,100,300]);

    setTimeout(listo, 4000);

    return;
  }


  // ---------------- ERROR GENERAL ----------------

  mostrar(
    "error",
    "❌ NO SE REGISTRÓ",
    escapar(
      r.mensaje ||
      "Error desconocido."
    )
  );

  vibrar([300,100,300]);

  setTimeout(listo, 3000);
}


// ======================================================
// INFORMACIÓN ALUMNO
// ======================================================

function alumnoHTML(r) {

  return (

    '<div class="nombre">' +
    escapar(r.nombre) +
    '</div>' +

    '<div class="grupo">' +
    escapar(r.grado) +
    '.º ' +
    escapar(r.grupo) +
    '</div>' +

    '<div class="ruta">' +
    '🚌 ' +
    escapar(
      r.ruta ||
      "PENDIENTE"
    ) +
    '</div>' +

    '<div class="parada">' +
    '📍 ' +
    escapar(
      r.parada ||
      "PENDIENTE"
    ) +
    '</div>' +

    '<div class="hora">' +
    '🕐 ' +
    escapar(r.hora) +
    '</div>'

  );
}


function alumnoSinHora(r) {

  return (

    '<div class="nombre">' +
    escapar(r.nombre) +
    '</div>' +

    '<div class="grupo">' +
    escapar(r.grado) +
    '.º ' +
    escapar(r.grupo) +
    '</div>' +

    '<div class="ruta">' +
    '🚌 ' +
    escapar(
      r.ruta ||
      "PENDIENTE"
    ) +
    '</div>' +

    '<div class="parada">' +
    '📍 ' +
    escapar(
      r.parada ||
      "PENDIENTE"
    ) +
    '</div>'

  );
}


// ======================================================
// PANTALLA
// ======================================================

function mostrar(
  clase,
  titulo,
  contenido,
  html
) {

  const estado =
    document.getElementById("estado");

  estado.className = clase || "";

  estado.innerHTML =
    '<div class="mensaje">' +
    titulo +
    '</div>' +

    (
      html
        ? contenido
        : '<p>' + contenido + '</p>'
    );
}


function listo() {

  procesando = false;


  if (!ruta) {

    mostrar(
      "advertencia",
      "🚌 SELECCIONA UNA RUTA",
      "Selecciona el autobús antes de escanear."
    );

    return;
  }


  mostrar(
    "",
    "📷 LISTO PARA ESCANEAR",
    movimiento + " · " + ruta
  );
}


// ======================================================
// UTILIDADES
// ======================================================

function reiniciarLectura() {

  ultimoCodigo = "";

  ultimoMomento = 0;
}


function escapar(texto) {

  const div =
    document.createElement("div");

  div.textContent =
    String(texto ?? "");

  return div.innerHTML;
}


function vibrar(patron) {

  if (navigator.vibrate) {
    navigator.vibrate(patron);
  }
}


// ======================================================
// CÁMARA
// ======================================================

const lector =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]
    },

    false
  );


lector.render(
  escaneado,
  function() {}
);

</script>

</body>
</html>
