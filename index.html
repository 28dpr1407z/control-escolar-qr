<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Escolar QR GSR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #17365d;
      text-align: center;
    }

    header {
      background: #17365d;
      color: white;
      padding: 15px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
    }

    main {
      max-width: 500px;
      margin: auto;
      padding: 14px;
    }

    .selector {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .modo {
      flex: 1;
      padding: 15px 5px;
      border-radius: 12px;
      border: 2px solid #ccc;
      background: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      opacity: .55;
    }

    #btnEntrada.activo {
      background: #2e7d32;
      color: white;
      border-color: #2e7d32;
      opacity: 1;
    }

    #btnSalida.activo {
      background: #1565c0;
      color: white;
      border-color: #1565c0;
      opacity: 1;
    }

    #modoActual {
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 17px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    #estado {
      margin-top: 15px;
      padding: 20px 15px;
      border-radius: 15px;
      background: white;
      min-height: 115px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .entrada {
      background: #e8f5e9 !important;
      color: #146c2e;
      border: 2px solid #4caf50;
    }

    .salida {
      background: #e3f2fd !important;
      color: #0d47a1;
      border: 2px solid #2196f3;
    }

    .duplicado {
      background: #fff8e1 !important;
      color: #805b00;
      border: 2px solid #ffc107;
    }

    .error {
      background: #ffebee !important;
      color: #b71c1c;
      border: 2px solid #ef5350;
    }

    .mensaje {
      font-size: 20px;
      font-weight: bold;
    }

    .nombre {
      font-size: 24px;
      font-weight: bold;
      margin-top: 9px;
    }

    .grupo {
      font-size: 21px;
      margin-top: 6px;
    }

    .hora {
      font-size: 20px;
      margin-top: 6px;
      font-weight: bold;
    }

    .pie {
      margin-top: 14px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>CONTROL DE ACCESO</h1>
  <p>Escuela Primaria Prof. Graciano Sánchez Romo</p>
</header>

<main>

  <div class="selector">
    <button
      id="btnEntrada"
      class="modo activo"
      onclick="cambiarModo('ENTRADA')">
      🟢 ENTRADA
    </button>

    <button
      id="btnSalida"
      class="modo"
      onclick="cambiarModo('SALIDA')">
      🔵 SALIDA
    </button>
  </div>

  <div id="modoActual">
    Modo actual: 🟢 ENTRADA
  </div>

  <div id="reader"></div>

  <div id="estado">
    <div class="mensaje">📷 Iniciando cámara...</div>
  </div>

  <div class="pie">
    Ciclo Escolar 2026–2027
  </div>

</main>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx8r4ubVKQkRKfH6kCjVdLJWuktdn3mwaJ2hJrOxgzIOP-GATweZZw7DVgeEEFIa8US/exec";

let tipoActual = "ENTRADA";
let procesando = false;
let ultimoCodigo = "";
let ultimoEnvio = 0;

// Evita reenviar inmediatamente el mismo QR.
const BLOQUEO_LOCAL_MS = 8000;


/* ================================
   CAMBIAR ENTRADA / SALIDA
================================ */

function cambiarModo(tipo) {

  if (procesando) {
    return;
  }

  tipoActual = tipo;

  const entrada =
    document.getElementById("btnEntrada");

  const salida =
    document.getElementById("btnSalida");

  const texto =
    document.getElementById("modoActual");

  if (tipo === "ENTRADA") {

    entrada.classList.add("activo");
    salida.classList.remove("activo");

    texto.innerHTML =
      "Modo actual: 🟢 ENTRADA";

  } else {

    salida.classList.add("activo");
    entrada.classList.remove("activo");

    texto.innerHTML =
      "Modo actual: 🔵 SALIDA";
  }

  // Permite escanear una matrícula que pudiera
  // haberse usado anteriormente en el otro modo.
  ultimoCodigo = "";
  ultimoEnvio = 0;

  listoSiguiente();
}


/* ================================
   QR DETECTADO
================================ */

function qrDetectado(texto) {

  texto = String(texto || "")
    .trim()
    .toUpperCase();

  if (!texto || procesando) {
    return;
  }

  const ahora = Date.now();

  if (
    texto === ultimoCodigo &&
    ahora - ultimoEnvio < BLOQUEO_LOCAL_MS
  ) {
    return;
  }

  procesando = true;
  ultimoCodigo = texto;
  ultimoEnvio = ahora;

  const estado =
    document.getElementById("estado");

  estado.className = "";

  estado.innerHTML =
    '<div class="mensaje">⏳ VERIFICANDO...</div>' +
    '<p>' + tipoActual + '</p>';

  const url =
    API_URL +
    "?matricula=" +
    encodeURIComponent(texto) +
    "&tipo=" +
    encodeURIComponent(tipoActual) +
    "&t=" +
    Date.now();

  fetch(url, {
    method: "GET",
    cache: "no-store"
  })

  .then(function(respuesta) {

    if (!respuesta.ok) {
      throw new Error("HTTP " + respuesta.status);
    }

    return respuesta.json();
  })

  .then(function(resultado) {
    mostrarResultado(resultado);
  })

  .catch(function(error) {

    console.error(error);

    estado.className = "error";

    estado.innerHTML =
      '<div class="mensaje">❌ ERROR DE CONEXIÓN</div>' +
      '<p>No se pudo completar el registro.</p>';

    vibrar([300,100,300]);

    setTimeout(listoSiguiente, 3000);
  });
}


/* ================================
   MOSTRAR RESULTADO
================================ */

function mostrarResultado(resultado) {

  const estado =
    document.getElementById("estado");

  if (resultado.ok) {

    if (resultado.tipo === "SALIDA") {

      estado.className = "salida";

      estado.innerHTML =
        '<div class="mensaje">🔵 SALIDA REGISTRADA</div>' +
        datosAlumno(resultado);

      vibrar([150,80,150]);

    } else {

      estado.className = "entrada";

      estado.innerHTML =
        '<div class="mensaje">🟢 ENTRADA REGISTRADA</div>' +
        datosAlumno(resultado);

      vibrar([100,60,100]);
    }

    setTimeout(listoSiguiente, 2500);
    return;
  }


  if (resultado.duplicado) {

    estado.className = "duplicado";

    estado.innerHTML =
      '<div class="mensaje">⚠️ ' +
      escapar(resultado.tipo) +
      ' YA REGISTRADA</div>' +

      '<div class="nombre">' +
      escapar(resultado.nombre) +
      '</div>' +

      '<div class="grupo">' +
      escapar(resultado.grado) +
      '.º ' +
      escapar(resultado.grupo) +
      '</div>' +

      '<p>No se creó un registro duplicado.</p>';

    vibrar([250]);

    setTimeout(listoSiguiente, 2500);
    return;
  }


  if (resultado.sinEntrada) {

    estado.className = "error";

    estado.innerHTML =
      '<div class="mensaje">⛔ SIN ENTRADA</div>' +

      '<div class="nombre">' +
      escapar(resultado.nombre) +
      '</div>' +

      '<div class="grupo">' +
      escapar(resultado.grado) +
      '.º ' +
      escapar(resultado.grupo) +
      '</div>' +

      '<p>Este alumno no tiene una entrada registrada hoy.</p>';

    vibrar([300,100,300]);

    setTimeout(listoSiguiente, 3000);
    return;
  }


  estado.className = "error";

  estado.innerHTML =
    '<div class="mensaje">❌ ERROR</div>' +
    '<p>' +
    escapar(
      resultado.mensaje ||
      "No fue posible registrar."
    ) +
    '</p>';

  vibrar([300,100,300]);

  setTimeout(listoSiguiente, 3000);
}


/* ================================
   DATOS DEL ALUMNO
================================ */

function datosAlumno(resultado) {

  return (
    '<div class="nombre">' +
    escapar(resultado.nombre) +
    '</div>' +

    '<div class="grupo">' +
    escapar(resultado.grado) +
    '.º ' +
    escapar(resultado.grupo) +
    '</div>' +

    '<div class="hora">🕐 ' +
    escapar(resultado.hora) +
    '</div>'
  );
}


/* ================================
   SIGUIENTE ALUMNO
================================ */

function listoSiguiente() {

  procesando = false;

  const estado =
    document.getElementById("estado");

  estado.className = "";

  estado.innerHTML =
    '<div class="mensaje">📷 LISTO PARA EL SIGUIENTE ALUMNO</div>' +
    '<p>Modo: <strong>' +
    tipoActual +
    '</strong></p>';
}


/* ================================
   SEGURIDAD DE TEXTO
================================ */

function escapar(texto) {

  const div =
    document.createElement("div");

  div.textContent =
    String(texto ?? "");

  return div.innerHTML;
}


/* ================================
   VIBRACIÓN
================================ */

function vibrar(patron) {

  if (navigator.vibrate) {
    navigator.vibrate(patron);
  }
}


/* ================================
   INICIAR CÁMARA
================================ */

const lector =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]
    },

    false
  );

lector.render(
  qrDetectado,
  function(error) {
    // Se ignoran los intentos de lectura
    // mientras no haya un QR válido.
  }
);

</script>

</body>
</html>
